# Datasets for the CPU benchmark. prepare.py turns each entry into
# bench/data/<name>/ (train/test split in every tool's input format).
#
# Keys:
#   source         CSV file, relative to the repository root (header row required)
#   label          label column name, or "last" (default)
#   drop           columns that are not features (e.g. ["Id"])
#   test_source    CSV file of the test rows (same columns as source): then
#                  source's rows are the training set and split is not used
#   split          "random": shuffle with `seed`, then take the test rows
#                  "tail":   the last rows are the test set (the published split
#                            of SUSY and HIGGS: their rows are already random;
#                            ./tree --test-last 500000 on the CSV is the same)
#   test_fraction  share of rows in the test set (default 0.2), or
#   test_rows      an exact number of test rows (wins over test_fraction)
#   train_rows     use only the first N training rows (0 = all; default 0)
#   max_test_rows  cap the test set (0 = no cap; default 0)
#   seed           shuffle seed for split = "random" (default 1)
#   yadt           write YaDT's files (default true; false for huge datasets
#                  that YaDT never runs on)
#
# Only numeric features are supported for now. A smaller variant of a dataset
# is just another entry with the same source and train_rows set.

[diabetes]
source = "tests/data/diabetes.csv"
split = "random"

[covertype_10k]
source = "datasets/covertype.csv"
drop = ["Id"]
split = "random"
train_rows = 10_000
max_test_rows = 2_500

[covertype]
source = "datasets/covertype.csv"
drop = ["Id"]
split = "random"

[susy_50k]
source = "datasets/supersymmetry.csv"
drop = ["Id"]
split = "tail"
test_rows = 500_000
train_rows = 50_000
max_test_rows = 12_500

[susy]
source = "datasets/supersymmetry.csv"
drop = ["Id"]
split = "tail"
test_rows = 500_000

[higgs]
source = "datasets/higgs.csv"
drop = ["Id"]
split = "tail"
test_rows = 500_000

[susy_500k]
source = "datasets/supersymmetry.csv"
drop = ["Id"]
split = "tail"
test_rows = 500_000
train_rows = 500_000
max_test_rows = 100_000

# US flights 1987-2008 (gbm-bench's airline, 115M rows, 13 integer features,
# carrier and airports as codes; label: arrival delayed). Made from the public
# download by bench/cluster/make_datasets.py. The rows are in date
# order, so the test set is a random sample.
[airline]
source = "datasets/airline.csv"
split = "random"
test_rows = 500_000

# ECBDL'14 (protein contact maps, GECCO 2014 big data competition): 32M rows,
# 631 features (92 nominal ones as integer codes), label 0/1 (~2% contacts).
# Made from the ARFF by bench/cluster/make_datasets.py; cluster-only. The test
# rows are only set aside (the cluster runs measure training alone), so no
# YaDT files: they would copy the 70 GB training CSV. ecbdl_15m is a random
# 15M of ecbdl's training rows (the first 15M of ecbdl's shuffled training
# rows): about the most that fits on an 80 GB GPU, which needs 8 bytes per value
# (one copy of the presorted columns) plus one spare column. The competition's
# own labelled test set is datasets/ecbdl/ecbdl_test.csv (2.9M rows, made by
# bench/cluster/ecbdl_test.py), not used here.
[ecbdl]
source = "datasets/ecbdl/ecbdl.csv"
split = "random"
test_rows = 100_000
yadt = false

[ecbdl_15m]
source = "datasets/ecbdl/ecbdl.csv"
split = "random"
test_rows = 100_000
train_rows = 15_000_000
yadt = false

# A 3x3 checkerboard (x and y uniform on a grid of 32,768 values in [0, 3],
# 3k/32767 to six decimals; the class alternates between
# the nine unit squares: 5 squares B, 4 A), from C4.5-format files made by
# bench/cluster/make_datasets.py; cluster-only. The CSVs are in train.csv's
# format, so prepare.py links train.csv to them when a set takes all rows. Each
# set comes with its own test file. The sizes nest: 1m is the first 1M rows of
# 10m, 10m the first 10M of 50m, 50m the first 50M of 100m, 100m of 500m, 500m of 2b; 1b is
# 100m ten times over (100M distinct rows, each 10 times). 2b is generated
# (2026-10-22): 100m's rows, then 1.9G new ones.
# No YaDT files from 50m on (no YaDT on the cluster).
[chess_1m]
source = "datasets/chess/chess_1m.csv"
test_source = "datasets/chess/chess_1m_test.csv"

[chess_10m]
source = "datasets/chess/chess_10m.csv"
test_source = "datasets/chess/chess_10m_test.csv"

[chess_50m]
source = "datasets/chess/chess_100m.csv"
test_source = "datasets/chess/chess_100m_test.csv"
train_rows = 50_000_000
yadt = false

[chess_100m]
source = "datasets/chess/chess_100m.csv"
test_source = "datasets/chess/chess_100m_test.csv"
yadt = false

[chess_500m]
source = "datasets/chess/chess_2b.csv"
test_source = "datasets/chess/chess_100m_test.csv"
train_rows = 500_000_000
yadt = false

[chess_1b]
source = "datasets/chess/chess_1b.csv"
test_source = "datasets/chess/chess_1b_test.csv"
yadt = false

[chess_2b]
source = "datasets/chess/chess_2b.csv"
test_source = "datasets/chess/chess_100m_test.csv"
yadt = false
